name: Android Build (EAS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile (production = AAB for Play Store, preview = APK for direct install)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - preview

jobs:
  build:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'production' }} --non-interactive
